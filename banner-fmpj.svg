<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Find My Perfect Job: an open skill for finding your next role</title>
<desc id="d">A conversational skill that maps your strengths and the fields you are interested in. It produces 30 career paths across three tiers, lets you explore related industries, and plans your next steps. A diagram shows the stages feeding into a roadmap and next-step plan.</desc>
