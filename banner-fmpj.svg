<text x="60" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e6edf7">Know what drives you.</text>
<text x="60" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#5eead4">Then choose your next role.</text>

