<title id="t">Find My Perfect Job: an open skill for finding your next role</title>
<desc id="d">An open skill that works out your drivers and strengths, then maps 30 career paths across three tiers and a 6-month action plan. A diagram shows the four stages feeding into a roadmap with three tiers and a 6-month plan.</desc>
